<!--
  Spotify pairing relay page.

  Deploy this one file somewhere with HTTPS (e.g. GitHub Pages) and register
  its URL as the Redirect URI in your Spotify app dashboard -- see the
  project README's pairing section for why this is needed and how it works.

  It does no network requests of its own: it just reads `code`/`state` from
  its own URL (appended by Spotify) and does a plain browser navigation to
  the device's local IP, embedded earlier in `state` by the firmware. That's
  a top-level navigation, not a fetch/XHR, so it isn't blocked by
  mixed-content or Private Network Access restrictions the way a background
  request to a local IP would be.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Display Pairing</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .card { max-width: 360px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { color: #b3b3b3; line-height: 1.5; margin: 0; }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 22px;
    background: #1DB954;
    color: #000;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 16px;
    border: 3px solid #2a2a2a;
    border-top-color: #1DB954;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connecting to your device&hellip;</h1>
    <p id="message">Hang tight, this only takes a second.</p>
    <a class="button" id="continueLink" href="#" style="display:none">Continue to device</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var error = params.get('error');
      var code = params.get('code');
      var state = params.get('state');

      var titleEl = document.getElementById('title');
      var messageEl = document.getElementById('message');
      var spinnerEl = document.getElementById('spinner');
      var linkEl = document.getElementById('continueLink');

      function showError(title, message) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = title;
        messageEl.textContent = message;
      }

      if (error) {
        showError(
          'Authorization was not completed',
          'Spotify said: ' + error + '. Please scan the code on the device again to retry.'
        );
        return;
      }

      if (!code || !state) {
        showError(
          'Missing information',
          'This link is missing required parameters. Please scan the QR code on the device again.'
        );
        return;
      }

      // state = "<nonce>~<device-ip>~<port>" -- set by the device so this
      // generic page knows where to hand the code back to.
      var parts = state.split('~');
      if (parts.length !== 3) {
        showError(
          'Malformed request',
          'Could not figure out which device to connect to. Please scan the QR code again.'
        );
        return;
      }

      var deviceIp = parts[1];
      var devicePort = parts[2];
      var target = 'http://' + deviceIp + ':' + devicePort + '/pair'
        + '?code=' + encodeURIComponent(code)
        + '&state=' + encodeURIComponent(state);

      linkEl.href = target;
      linkEl.style.display = 'inline-block';
      messageEl.textContent = 'Redirecting you to your device on the local network...';

      window.location.href = target;
    })();
  </script>
</body>
</html>
